[project]
name = "workflowpro-backend"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"